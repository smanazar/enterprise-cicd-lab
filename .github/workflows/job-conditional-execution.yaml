
name: Day 4 - Conditional Job Execution

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        run: |
          pwd                                  
          df 

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    steps:
      - name: Deploy
        run: echo "Validation passed. Starting deployment."

  notify:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    steps:
      - name: Notify
        run: echo "Deployment validation completed successfully."
