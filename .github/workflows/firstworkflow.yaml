
name: Day 4 - Job Outputs

on:
  workflow_dispatch:

jobs:
  detect_environment:
    runs-on: ubuntu-latest

    outputs:
      environment_name: ${{ steps.config.outputs.environment_name }}

    steps:
      - name: Set environment
        id: config
        run: |
          echo "environment_name=development" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: detect_environment

    steps:
      - name: Display environment
        run: |
          echo "Deploying to: ${{ needs.detect_environment.outputs.environment_name }}"

